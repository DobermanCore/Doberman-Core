[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doberman-example-plugin-detector"
version = "0.1.0"
description = "Tutorial: a minimal custom behavioral Detector registered via the doberman.detectors entry-point group."
requires-python = ">=3.11"
dependencies = ["doberman-core"]

# This is the whole extensibility contract: core discovers the group at runtime
# via importlib.metadata and never imports this package by name.
[project.entry-points."doberman.detectors"]
example_detector = "example_detector_plugin.detectors:ExampleDetector"

[tool.hatch.build.targets.wheel]
packages = ["src/example_detector_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
