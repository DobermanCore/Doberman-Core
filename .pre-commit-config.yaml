# Local, optional convenience hooks mirroring the checks CI already runs
# (.github/workflows/ci.yml): ruff check, ruff format --check, lint-imports.
# They only check - no --fix, no --unsafe-fixes - so a commit can never
# silently rewrite security-relevant logic without a human reviewing the diff.
#
# Install once per clone:      pre-commit install
# Run against the whole tree:  pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format-check
        name: ruff format --check
        entry: ruff format --check .
        language: system
        pass_filenames: false
      - id: lint-imports
        name: lint-imports
        entry: lint-imports
        language: system
        pass_filenames: false