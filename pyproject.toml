[project]
name = "doberman-core"
version = "0.18.5"
description = "Adaptive authorization layer for coding agents (open core)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "fu351" }]
keywords = [
    "security",
    "authorization",
    "ai-agents",
    "llm",
    "mcp",
    "guardrails",
    "agent-security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2",
    "mcp>=1.27,<2",
    "aiosqlite",
    "pyotp",
    "pyyaml",
    "typer",
    "river>=0.21; python_version >= '3.12'",
    # river 0.26.0 subscripts csv.DictReader at import time (PEP 585 on a stdlib
    # class that only grew __class_getitem__ in 3.12), so it cannot even be
    # imported on 3.11. Cap it there; lift when river ships a 3.11-safe release.
    "river>=0.21,<0.26; python_version < '3.12'",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "pytest-xdist", "ruff>=0.15,<0.16", "import-linter", "textual", "hypothesis", "starlette", "uvicorn", "httpx"]
explain = ["anthropic"]
tui = ["textual"]
dash = ["starlette", "uvicorn"]
sbom = ["pip-audit"]
# Windows Hello biometric approval (2FA). Windows-only; the backend degrades to a
# TOTP fallback when this is absent or off-Windows, so it is never a hard dependency.
winhello = ["winsdk; sys_platform == 'win32'"]

[project.scripts]
doberman = "doberman.cli.main:app"

[project.urls]
Homepage = "https://github.com/DobermanCore/Doberman-Core"
Repository = "https://github.com/DobermanCore/Doberman-Core"
Issues = "https://github.com/DobermanCore/Doberman-Core/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doberman"]

# Lock down exactly what ships in the sdist so no local/runtime files (graphify-out,
# .doberman/, *.db, key files, dev plans) can ever leak into a published artifact.
# Patterns are gitignore-style: the leading "/" anchors each one to the project root,
# so an unrelated nested copy of the tree (e.g. a stray git worktree inside the
# checkout) can never match and leak into the artifact.
# "/tools" ships explicitly because [tool.pytest.ini_options] testpaths lists it.
[tool.hatch.build.targets.sdist]
include = [
    "/src/doberman",
    "/tests",
    "/tools",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "tools"]   # tools/ holds rule-lab tooling + its co-located tests
addopts = "-q"
markers = [
    "guarantee(name, host): claims a parity-matrix cell; collected by tools/parity (docs/PARITY.md)",
]

[tool.coverage.run]
source = ["doberman"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "B", "S"]   # imports, bugbear, security

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # pytest tests use bare asserts by design
"tools/**/tests/**" = ["S101"]   # rule-lab tooling tests, same convention

[tool.importlinter]
root_package = "doberman"
include_external_packages = true

# Inside-core decoupling: the policy core must not import an invocation adapter
# (the MCP proxy, the host-harness hooks, the dash, or the turngate = the
# pre-inference gate). Adapters depend on the engine, never the reverse — so the
# safety-critical core stays small, open, and adapter-agnostic; decide()/decide_turn()
# take their guardrails by injection so the engine holds no static reference.
[[tool.importlinter.contracts]]
name = "Policy core must not depend on an invocation adapter"
type = "forbidden"
source_modules = ["doberman.engine", "doberman.roles", "doberman.policy", "doberman.storage", "doberman.auth", "doberman.subjective", "doberman.egress"]
forbidden_modules = ["doberman.proxy", "doberman.hosthooks", "doberman.dash", "doberman.turngate"]

# Cross-repo boundary: the public core must never import the private enterprise package.
# NOTE: defense-in-depth only — enterprise is never installed in core CI, so this contract
# is trivially kept there; the CI "standalone guarantee" step is the operative guard.
[[tool.importlinter.contracts]]
name = "Public core must not depend on the private enterprise package"
type = "forbidden"
source_modules = ["doberman"]
forbidden_modules = ["doberman_enterprise"]

[[tool.importlinter.contracts]]
name = "CLI telemetry must not depend on a tool-call hot path"
type = "forbidden"
source_modules = ["doberman.telemetry"]
forbidden_modules = ["doberman.proxy", "doberman.hosthooks"]

# Hot-path decoupling: the objective-rules package is built by the host hooks on
# EVERY tool call, in a cold-start CLI process, so it must never drag in the
# subjective layer's heavy ML import chain (river/numpy/scipy, pulled in via
# doberman.subjective.{baseline,drift,martingale}). engine.trifecta was extracted
# as a models-only leaf (see its module docstring) precisely so engine.rules could
# share the lethal-trifecta predicate without importing engine.subjective; this
# contract makes that convention a CI-enforced invariant instead of a review-only
# one. forbidden_modules names numpy/scipy/river directly (not just
# doberman.subjective) so a future rule that reaches the ML libraries through any
# path — not only the current one — still fails the contract.
[[tool.importlinter.contracts]]
name = "Objective-rules hot path must not depend on the subjective ML import chain"
type = "forbidden"
source_modules = ["doberman.engine.rules", "doberman.engine.trifecta", "doberman.engine.objective"]
forbidden_modules = ["doberman.engine.subjective", "doberman.engine.detectors", "numpy", "scipy", "river"]
