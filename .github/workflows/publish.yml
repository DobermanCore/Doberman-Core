name: Publish

# Publishing uses PyPI Trusted Publishing (OIDC) — there are NO API tokens stored
# in this repo. PyPI/TestPyPI are configured to trust this repo + workflow + the
# GitHub Environments named below. See RELEASING.md for the one-time setup.
on:
  release:
    types: [published]     # tag a GitHub Release -> publish to PyPI
  workflow_dispatch:       # manual run -> TestPyPI dry run by default; target=pypi republishes
    inputs:
      target:
        description: "Where to publish (testpypi is a dry run; pypi republishes main's version)"
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      tag:
        description: "Existing release tag to attach the SBOM to when target=pypi (e.g. v0.18.4)"
        type: string
        default: ""

permissions:
  contents: read

# Never cancel a publish in flight; queue a second one behind it instead.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - name: Generate SBOM (CycloneDX)
        # ponytail: SBOM generation only, not a vulnerability gate — a newly disclosed CVE in a
        # transitive dependency shouldn't silently block a release nobody's reviewed yet.
        # continue-on-error (not `|| true`) so a finding still shows as a warning in the run,
        # instead of a clean green check hiding it. Add a blocking `pip-audit` step separately
        # if/when an actual release gate is wanted.
        # The SBOM lives OUTSIDE dist/: the publish action uploads every file in dist/ and
        # rejects anything that is not a wheel or sdist (this broke v0.18.2–v0.18.4).
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip-audit
          mkdir -p sbom
          pip-audit -f cyclonedx-json -o sbom/sbom.json .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: hashFiles('sbom/sbom.json') != ''
        with:
          name: sbom
          path: sbom/sbom.json

  pypi-publish:
    name: Publish to PyPI
    needs: build
    timeout-minutes: 15
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/doberman-core
    permissions:
      id-token: write     # required for Trusted Publishing (OIDC)
      contents: write     # required to attach the SBOM to the GitHub Release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true   # no SBOM artifact when pip-audit failed in build
        with:
          name: sbom
          path: sbom/
      - name: Version matches the release tag
        # A manual target=pypi run builds main; refuse to upload if main's version and the
        # tag it is meant for disagree (the SBOM would otherwise land on the wrong release).
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          version=$(basename "$wheel" | cut -d- -f2)
          echo "wheel version: $version; tag: ${TAG:-<none>}"
          if [ -n "$TAG" ] && [ "v$version" != "$TAG" ]; then
            echo "::error::pyproject version $version does not match tag $TAG"
            exit 1
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Attach SBOM to the GitHub Release
        if: hashFiles('sbom/sbom.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # no checkout in this job, so gh cannot infer the repo
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            gh release upload "$TAG" sbom/sbom.json --clobber
          else
            echo "no release tag given; SBOM kept as a workflow artifact only"
          fi

  testpypi-publish:
    name: Publish to TestPyPI (dry run)
    needs: build
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && inputs.target != 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/doberman-core
    permissions:
      id-token: write     # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
