name: Publish

# Publishing uses PyPI Trusted Publishing (OIDC) — there are NO API tokens stored
# in this repo. PyPI/TestPyPI are configured to trust this repo + workflow + the
# GitHub Environments named below. See RELEASING.md for the one-time setup.
on:
  release:
    types: [published]     # tag a GitHub Release -> publish to PyPI
  workflow_dispatch: {}    # manual run -> dry-run publish to TestPyPI

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - name: Generate SBOM (CycloneDX)
        # ponytail: SBOM generation only, not a vulnerability gate — a newly disclosed CVE in a
        # transitive dependency shouldn't silently block a release nobody's reviewed yet.
        # continue-on-error (not `|| true`) so a finding still shows as a warning in the run,
        # instead of a clean green check hiding it. Add a blocking `pip-audit` step separately
        # if/when an actual release gate is wanted.
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit -f cyclonedx-json -o dist/sbom.json .
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/doberman-core
    permissions:
      id-token: write     # required for Trusted Publishing (OIDC)
      contents: write     # required to attach the SBOM to the GitHub Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Attach SBOM to the GitHub Release
        if: hashFiles('dist/sbom.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/sbom.json --clobber

  testpypi-publish:
    name: Publish to TestPyPI (dry run)
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/doberman-core
    permissions:
      id-token: write     # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
