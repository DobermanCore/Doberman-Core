name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Supersede a stale PR run, but never cancel a main-branch run: every commit on
  # main keeps its own verdict (a cancelled main run is a commit nobody tested).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  static:
    name: Lint, boundaries, docs, parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Offline Markdown link check
        run: python scripts/check_markdown_links.py
      - name: Changelog fragments
        run: python scripts/compile_changelog.py --check
      - name: Architecture & repo boundaries
        run: lint-imports
      - name: Parity matrix is current
        run: python -m tools.parity.generate_parity --check
      - name: Installed dependency set is consistent
        run: python -m pip check
  test:
    # Explicit name so the matrix's extra `coverage` key does not change the job
    # names that branch protection and the merge queue key on.
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Job ceiling: the Linux legs run 4-7 min. The per-test --timeout below is
    # what catches a hang; this only bounds a pathological runner. (The Windows
    # leg is the sharded `test-windows` job below, with its own ceiling.)
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # Coverage is measured on ONE leg. Branch-coverage tracing costs ~25% of
          # the suite's wall-clock (measured 2026-08-03, ADR 0055) and the number
          # is identical on every leg, so paying it four times bought nothing.
          # `coverage` is deliberately NOT a base matrix key: an include entry that
          # only ADDS a key merges into the existing ubuntu/3.12 combination, while
          # one that overrides a base key would create a fifth, duplicate leg.
          - os: "ubuntu-latest"
            python-version: "3.12"
            coverage: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Standalone guarantee (no enterprise installed)
        run: |
          if pip list | grep -qi doberman-enterprise; then
            echo "FAIL: enterprise package found in core environment"
            exit 1
          fi
          echo "ok: core has no enterprise dependency"
      # --timeout: a single stuck test dies in 5 min instead of taking the whole
      # leg to the job timeout. The production-size gate modules carry their own
      # `timeout` marker (see their `pytestmark`) because their module-scoped eval
      # fixture lands on one item. On Windows the only method is `thread`, which
      # os._exit()s the xdist worker, and the worker's traceback goes to a stdout
      # that execnet points at NUL - the controller only sees "node down".
      # --max-worker-restart=0: a dead worker ends the run at once, reported as
      # "worker crashed while running <test>". Left at the default, xdist 3.8
      # replaces the worker and `--dist loadgroup` re-queues the dead worker's
      # already-completed scopes as empty units (pytest-xdist#1378): the session
      # then either deadlocks at ~99% until the job cap (ten Windows runs,
      # 2026-09-03/04) or dies with `KeyError: <WorkerController gwN>`.
      # --durations: every run reports its slowest tests, so a creeping suite is
      # visible in the log before it becomes a timeout.
      # The GUI auth dialog is real Tk widgets; without a display its tests skip
      # and ~800 lines never execute. A virtual X server lets the Linux legs run
      # them for real (Windows has a desktop already).
      - name: Virtual display for the Tk dialog tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Test suite
        env:
          DOBERMAN_TEST_FAST_HST_GATES: ${{ matrix.fast_gates && '1' || '' }}
        run: >
          ${{ runner.os == 'Linux' && 'xvfb-run -a -s "-screen 0 1280x800x24"' || '' }}
          pytest -n auto --dist loadgroup --max-worker-restart=0 --timeout=300 --durations=25 --durations-min=2.0
          ${{ matrix.coverage && '--cov=doberman --cov-report=term-missing --cov-fail-under=90' || '' }}
  test-windows:
    # Doberman is a local-first tool that runs on developer machines of every
    # OS, and it carries OS-specific code (e.g. the Windows O_BINARY key-write
    # path in storage/fingerprint.py). Guard that surface with a Windows leg so
    # cross-platform regressions surface in CI, not on a contributor's box.
    # (The nightly deep workflow adds Windows 3.11/3.13 and macOS.)
    # The leg is sharded four ways: the same ~5,500 tests take ~5 min on a Linux
    # runner and ~20 min on a Windows one (measured 2026-09-08, run 34277568161),
    # and that single job was the whole run's wall clock. pytest-split deselects
    # everything outside this shard's group at collection time; xdist still
    # parallelises within the shard. With no `.test_durations` file it splits
    # evenly by count, and `least_duration` interleaves neighbouring tests across
    # shards so a slow module is spread out rather than landing on one shard.
    name: test (windows-latest, 3.12, shard ${{ matrix.shard }}/4)
    runs-on: windows-latest
    # A quarter of the suite is ~5 min on a normal runner; a slow one has been
    # 1.7x that. The per-test --timeout below still catches a hang.
    timeout-minutes: 25
    # Windows runners default `run:` to PowerShell; pin bash (Git Bash ships on
    # GitHub's Windows images) so the shell-scripted steps behave identically to
    # the Linux legs.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Standalone guarantee (no enterprise installed)
        run: |
          if pip list | grep -qi doberman-enterprise; then
            echo "FAIL: enterprise package found in core environment"
            exit 1
          fi
          echo "ok: core has no enterprise dependency"
      # Same pytest flags as the Linux legs (rationale above). The gate modules
      # run at production size on every Linux leg and on every nightly leg; on
      # the Windows PR leg their DB-heavy eval stalled the job to its cap four
      # times (tests/conftest.py explains), hence the fast gates here.
      - name: Test suite (shard ${{ matrix.shard }} of 4)
        env:
          DOBERMAN_TEST_FAST_HST_GATES: "1"
        run: >
          pytest -n auto --dist loadgroup --max-worker-restart=0 --timeout=300 --durations=25 --durations-min=2.0
          --splits 4 --group ${{ matrix.shard }} --splitting-algorithm least_duration
  test-windows-gate:
    # One check carrying the pre-shard job's name, so branch protection's required
    # context "test (windows-latest, 3.12)" keeps working unchanged and a change
    # in shard count never needs a protection-rule edit. `if: always()` makes it
    # run (and fail) when a shard fails or is cancelled instead of being skipped.
    name: test (windows-latest, 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test-windows
    if: always()
    steps:
      - name: All four Windows shards passed
        run: |
          echo "shards: ${{ needs.test-windows.result }}"
          test "${{ needs.test-windows.result }}" = "success"
  package-smoke-test:
    name: package-smoke-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "WHEEL_ENV_BIN=$RUNNER_TEMP/wheel-env/Scripts" >> "$GITHUB_ENV"
            "$RUNNER_TEMP/wheel-env/Scripts/pip" install dist/*.whl
          else
            echo "WHEEL_ENV_BIN=$RUNNER_TEMP/wheel-env/bin" >> "$GITHUB_ENV"
            "$RUNNER_TEMP/wheel-env/bin/pip" install dist/*.whl
          fi
      - name: Smoke test — CLI entry point works standalone
        run: '"$WHEEL_ENV_BIN/doberman" --version'
      # `--version` only proves the modules shipped: it never reads package DATA.
      # builtin_roles.yaml is loaded lazily (roles.py), so dropping it from the
      # wheel would leave the check above green while every role lookup crashes.
      - name: Smoke test — bundled package data ships in the wheel
        run: >
          "$WHEEL_ENV_BIN/python" -c
          "from doberman.roles.roles import load_builtin_roles;
          assert load_builtin_roles(), 'builtin_roles.yaml missing from the wheel'"
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # The gitleaks CLI, not gitleaks-action: the action demands GITLEAKS_LICENSE on
      # org repos, and fork PRs cannot read secrets, so every contributor PR failed here
      # after the 2026-08-25 org move. The CLI (MIT) needs no key. Pinned + checksum-verified.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan the full git history
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1             --report-format json --report-path "$RUNNER_TEMP/gitleaks-report.json" .
